<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer data-screen-label="Footer" style="background:#270402; color:#FBF6EE; padding:clamp(72px,9vw,128px) clamp(16px,5vw,72px) {{ pad }}; font-family:Jost, sans-serif">
  <div style="max-width:1456px; margin:0 auto; display:flex; flex-direction:column; gap:clamp(40px,5vw,72px)">
    <div aria-hidden="true" style="display:flex; align-items:center; gap:20px">
      <span style="flex:1; height:1px; background:rgba(251,246,238,.22)"></span>
      <span style="width:28px; height:40px; background:#E29A64; -webkit-mask:url('assets/brand/logo/emblem-mono-currentColor.svg') center/contain no-repeat; mask:url('assets/brand/logo/emblem-mono-currentColor.svg') center/contain no-repeat"></span>
      <span style="flex:1; height:1px; background:rgba(251,246,238,.22)"></span>
    </div>
    <p style="margin:0; text-align:center; font-family:'Bodoni Moda', serif; font-weight:500; font-size:clamp(60px,14.5vw,236px); line-height:.9; letter-spacing:.04em; white-space:nowrap">THE FUEL</p>
    <nav aria-label="Footer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px 8px">
      <a href="{{ homeHref }}" style="min-height:44px; display:flex; align-items:center; padding:0 16px; border-radius:999px; color:#FBF6EE; text-decoration:none; font-size:16px" style-hover="background:rgba(226,154,100,.2)">Home</a>
      <a href="/menu" style="min-height:44px; display:flex; align-items:center; padding:0 16px; border-radius:999px; color:#FBF6EE; text-decoration:none; font-size:16px" style-hover="background:rgba(226,154,100,.2)">Menu</a>
      <a href="/space" style="min-height:44px; display:flex; align-items:center; padding:0 16px; border-radius:999px; color:#FBF6EE; text-decoration:none; font-size:16px" style-hover="background:rgba(226,154,100,.2)">Our Space</a>
      <a href="/space?page=visit" style="min-height:44px; display:flex; align-items:center; padding:0 16px; border-radius:999px; color:#FBF6EE; text-decoration:none; font-size:16px" style-hover="background:rgba(226,154,100,.2)">Visit</a>
      <a href="https://instagram.com/thefuelespresso" style="min-height:44px; display:flex; align-items:center; gap:8px; padding:0 16px; border-radius:999px; color:#FBF6EE; text-decoration:none; font-size:16px" style-hover="background:rgba(226,154,100,.2)"><i class="ph ph-instagram-logo" style="font-size:18px"></i>Instagram</a>
    </nav>
    <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px; padding-top:24px; border-top:1px solid rgba(251,246,238,.16); font:400 12px 'DM Mono', monospace; letter-spacing:.08em; text-transform:uppercase; color:#E3CBB3">
      <span>Espresso Yourself!</span>
      <span>8 AM to 2 AM · DHA Phase 6, Lahore</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;640px&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;homeHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { pad: this.props.phone ? '120px' : '40px', homeHref: this.props.homeHref ?? '/' };
  }
}
</script>
</body>
</html>
